<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 취향 테스트</title>
<meta name="description" content="조건 5개와 질문 15개로 나의 여행 유형과 추천 여행지 3곳을 알아보세요.">
<meta property="og:title" content="나한테 맞는 여행지는 어디일까? 여행 취향 테스트">
<meta property="og:description" content="3분이면 끝나는 여행 취향 테스트. 내 여행 유형, 학생 시절 모습, 찰떡 여행 메이트와 추천 여행지 3곳까지.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 탑승권 카드 한 장이 단계마다 바뀌고, 결과는 탑승권 + 여행지 카드 묶음 */
:root{
  --bg:#e7eef0; --paper:#fbfdfc; --ink:#14353d; --muted:#5b7177; --line:#c9d6d9;
  --accent:#e2543a; --stamp:#f2b33d; --soft:#dfecee; --warn:#d1342b;
  --display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1d21; --paper:#16292e; --ink:#e4efef; --muted:#93aaae; --line:#2b4349;
  --accent:#f0705a; --stamp:#f2b33d; --soft:#1d353b; --warn:#ff6b5e; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.wrap{max-width:600px;margin:0 auto;display:grid;gap:16px}
.pass{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:2px dashed var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.pass-body{padding:24px 20px;display:grid;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.2}
h1{font-size:clamp(34px,9vw,48px)} h2{font-size:28px}
h3{font-size:17px;font-weight:800}
p{margin:0}.muted{color:var(--muted)}
.route{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-weight:600;font-size:28px}
.route span.small{font-size:12px;color:var(--muted);display:block;font-weight:500}
.route .dash{flex:1;border-top:2px dotted var(--line);min-width:30px}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:14px 18px;cursor:pointer;background:var(--accent);color:#fff;width:100%;display:block;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.field{display:grid;gap:8px}
.field .t{font-weight:800;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.chips input:checked+label{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips input:focus-visible+label{outline:3px solid var(--stamp)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
/* 결과 */
.shared{background:var(--stamp);color:#2b1d00;border-radius:10px;padding:12px 14px;font-weight:800;font-size:14px}
.hero{display:flex;gap:18px;align-items:center}
.hero svg{width:104px;height:104px;flex:none}
.label{font-size:13px;color:var(--muted);font-weight:600}
.box{background:var(--soft);border-radius:12px;padding:16px;display:grid;gap:10px}
.mix{display:grid;gap:6px}
.mixrow{display:grid;grid-template-columns:84px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.mixbar{height:10px;background:var(--paper);border-radius:99px;overflow:hidden}
.mixbar i{display:block;height:100%;background:var(--ink)}
.mixrow.win .mixbar i{background:var(--accent)}
.mixrow b{font-variant-numeric:tabular-nums;text-align:right}
ul.picks{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.school{border:2px dashed var(--stamp);border-radius:12px;padding:16px;display:grid;gap:8px}
.mates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mate{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.mate .who{display:flex;align-items:center;gap:8px;font-weight:800}
.mate svg{width:40px;height:40px;flex:none}
.mate p{font-size:13px}
@media (max-width:420px){.mates{grid-template-columns:1fr}}
.dest{border-top:2px dashed var(--line);padding-top:20px;display:grid;gap:14px}
.dest-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dest h3{font-size:22px}
.code{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--stamp);color:#2b1d00;padding:2px 8px;border-radius:4px;white-space:nowrap}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;aspect-ratio:3/2;max-width:100%}
.gallery figure{margin:0;position:relative;overflow:hidden;border-radius:10px;background:var(--soft);min-width:0}
.gallery figure:first-child{grid-row:1/3}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery figcaption{position:absolute;left:6px;bottom:6px;background:rgba(10,25,30,.72);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sec{display:grid;gap:6px}
.sec h4{margin:0;font-size:14px;font-weight:800}
.sec ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.sec .warnline{color:var(--warn);font-size:13px;font-weight:600}
.sec a{color:var(--accent)}
.credit{font-size:11px;color:var(--muted)}
.credit a{color:var(--muted)}
.actions{display:grid;gap:8px}
.toast{font-size:13px;color:var(--muted);min-height:1.4em;text-align:center}
.note{font-size:12px;color:var(--muted)}
#imgOut{width:100%;max-width:320px;margin:0 auto;display:block;border-radius:12px;border:1px solid var(--line)}
.imgbox{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="pass" id="s-start">
    <div class="pass-head"><span>BOARDING PASS</span><span>ICN → ???</span></div>
    <div class="pass-body">
      <div class="route"><div>ICN<span class="small">인천</span></div><div class="dash"></div><div>???<span class="small">당신의 여행지</span></div></div>
      <h1>나한테 맞는 여행지는 어디일까?</h1>
      <p class="muted">조건 5개, 질문 15개에 답하면 여행 유형, 학생 시절 모습, 찰떡 여행 메이트, 추천 여행지 3곳을 알려드려요. 3분이면 끝나요.</p>
      <button class="btn" id="go">테스트 시작</button>
    </div>
  </section>

  <section class="pass" id="s-cond" hidden>
    <div class="pass-head"><span>STEP 1 · 여행 조건</span><span>5 / 5</span></div>
    <form class="pass-body" id="condForm">
      <div class="field"><span class="t">여행 기간</span><div class="chips" data-name="days"></div></div>
      <div class="field"><span class="t">예산 (1인, 항공·숙박 포함)</span><div class="chips" data-name="budget"></div></div>
      <div class="field"><span class="t">출발 시기</span><div class="chips" data-name="season"></div></div>
      <div class="field"><span class="t">원하는 날씨</span><div class="chips" data-name="weather"></div></div>
      <div class="field"><span class="t">어떤 곳이 좋아요?</span><div class="chips" data-name="place"></div></div>
      <button class="btn" type="submit">질문 시작하기</button>
    </form>
  </section>

  <section class="pass" id="s-q" hidden>
    <div class="pass-head"><span>STEP 2 · 취향 질문</span><span id="qnum">01 / 15</span></div>
    <div class="pass-body">
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
      <h2 id="qText"></h2>
      <div class="opts" id="qOpts"></div>
      <button class="btn ghost" id="back">이전 질문</button>
    </div>
  </section>

  <section class="pass" id="s-result" hidden>
    <div class="pass-head"><span>RESULT · 탑승권 발급 완료</span><span id="resCode"></span></div>
    <div class="pass-body" id="resBody"></div>
  </section>
</div>

<script>
const COND = {
  days:[["short","2~3일"],["mid","4~5일"],["long","1주 이상"]],
  budget:[["b1","50만원 이하"],["b2","50~100만원"],["b3","100~200만원"],["b4","200~300만원"],["b5","300만원 이상"]],
  season:[["spring","봄"],["summer","여름"],["fall","가을"],["winter","겨울"]],
  weather:[["warm","따뜻한 곳"],["cool","선선한 곳"],["any","상관없음"]],
  place:[["city","도시"],["resort","휴양지"],["both","둘 다"]]
};
const BUDGET = {b1:[0,50],b2:[50,100],b3:[100,200],b4:[200,300],b5:[300,9999]};
const DEF = {days:"short",budget:"b2",season:"spring",weather:"any",place:"both"};

const TYPES = {
  explorer:{n:"모험 개척자",col:"#7bbf6a",
    d:"지도 앱보다 자기 직감을 더 믿는 사람이에요. 동행에게 \"여기 길 맞아?\"를 하루 열 번 듣지만, 결국 제일 멋진 풍경은 당신이 찾아내요. 여행이 끝나면 신발은 너덜너덜, 사진첩은 레전드예요.",
    school:"선생님이 \"여기서 기다려\" 하면 이미 없어진 학생. 현장체험학습 미아 방송 단골인데, 돌아올 땐 꼭 남들 모르는 지름길이랑 매점 할인 정보를 들고 왔어요. 생활기록부 한 줄 평은 \"호기심이 풍부함\". 번역하면 \"말을 안 들음\".",
    best:["urban","둘 다 체력이 넘쳐서 하루 3만 보도 가능한 조합. 숙소는 잠만 자는 곳이에요."],
    worst:["healer","새벽 5시 일출 트레킹을 제안하는 순간 우정에 금이 가요."]},
  foodie:{n:"먹방 순례자",col:"#f5a35c",
    d:"관광지는 맛집과 맛집 사이의 이동 경로일 뿐이에요. 하루 다섯 끼가 기본이고, 배가 불러도 \"이건 디저트 배\"라는 과학적 근거를 제시해요. 여행 경비의 절반은 위장에 투자하는 진정한 미식 투자자예요.",
    school:"2교시 끝나기도 전에 도시락이 이미 비어 있던 학생. 시간표는 못 외워도 급식 메뉴표는 한 달 치를 외웠어요. 수학여행 기억은 \"그 휴게소 호두과자\"가 전부. 장래희망 칸엔 늘 \"맛있는 거 먹는 사람\"이라고 썼죠.",
    best:["healer","늘어지게 쉬다가 맛집만 쏙쏙 다녀오는 평화 조합이에요."],
    worst:["urban","카페 인테리어 사진 찍는 동안 음식 식는 걸 못 참아요."]},
  healer:{n:"느긋한 힐러",col:"#6cc3d5",
    d:"여행 와서까지 바쁘게 살 이유가 없다는 확고한 철학의 소유자예요. 일정표 대신 수영장 오픈 시간을 체크하고, \"오늘 뭐 했어?\"라는 질문에 \"아무것도\"라고 당당하게 답해요. 남들이 투어 버스 탈 때 선베드 각도를 연구하는 프로 휴식러예요.",
    school:"쉬는 시간 종 치기 3초 전에 이미 엎드려 있던 학생. 체육대회 땐 응원석 맨 뒷줄 그늘이 지정석이었어요. 수학여행 자유 시간엔 숙소 침대 사진부터 단톡방에 올렸죠. 그런데 이상하게 성적은 멀쩡해서 반 친구들을 열받게 했어요.",
    best:["foodie","같이 늘어지다가 맛있는 것만 먹으러 나가는 완벽한 휴가 조합이에요."],
    worst:["explorer","\"내일 새벽 5시 출발!\" 한마디에 조용히 방문을 잠가요."]},
  urban:{n:"도시 산책가",col:"#a58bd8",
    d:"도시의 공기를 마시면 체력이 차오르는 사람이에요. 골목 하나, 간판 하나에도 감탄하고, 하루 2만 보를 걸어도 \"벌써 끝이야?\"라고 말해요. 카메라 롤의 절반은 건물 사진, 나머지 절반은 카페 인테리어예요.",
    school:"필통보다 가방에 달린 키링이 더 많던 학생. 교복을 미세하게 줄여 입고 \"원래 이래요\"를 시전했어요. 수학여행 가면 관광지보다 그 동네 편집숍 위치부터 찾았고, 졸업앨범엔 혼자 필터 낀 것처럼 나왔죠.",
    best:["explorer","골목 탐험에 지칠 줄 모르는 둘. 동선 짜는 사람과 길 찾는 사람이 딱 나뉘어요."],
    worst:["foodie","맛집 웨이팅 2시간 vs 전시 하나 더 보기. 매번 협상 테이블이 열려요."]}
};
const TYPE_KEYS = ["explorer","foodie","healer","urban"];

const QS = [
  ["여행 첫날 아침, 눈 뜨자마자 하고 싶은 건?",["현지인이 줄 서는 아침 맛집 찾아가기","foodie"],["숙소 조식 먹고 수영장 가기","healer"]],
  ["일정표는 어떻게 짜요?",["시간 단위로 꼼꼼하게","urban"],["큰 틀만 정하고 그때그때","explorer"]],
  ["숙소를 고를 때 가장 중요한 건?",["뷰와 수영장, 침구","healer"],["위치! 어디든 걸어갈 수 있게","urban"]],
  ["여행 사진첩을 열면 가장 많은 사진은?",["음식 사진","foodie"],["풍경과 자연 사진","explorer"]],
  ["비 오는 날이 되면?",["미술관, 쇼핑몰, 카페 투어","urban"],["숙소에서 낮잠과 마사지","healer"]],
  ["하루에 얼마나 걷는 게 좋아요?",["2만 보도 괜찮아요","urban"],["최소한만 걷고 싶어요","healer"]],
  ["액티비티 하나만 고른다면?",["스쿠버다이빙이나 트레킹","explorer"],["현지 쿠킹 클래스","foodie"]],
  ["기념품으로 사 오는 건?",["현지 간식과 식재료","foodie"],["디자인 소품이나 편집숍 아이템","urban"]],
  ["처음 보는 길이 나오면?",["일단 들어가 본다","explorer"],["지도 앱으로 확인부터","urban"]],
  ["여행의 마무리는?",["노을 보며 해변에서 멍때리기","healer"],["야시장에서 마지막 한 입","foodie"]],
  ["여행 영상을 찍는다면 장르는?",["브이로그 먹방","foodie"],["드론으로 찍은 대자연","explorer"]],
  ["돈을 아끼지 않는 항목은?",["좋은 숙소","healer"],["체험과 투어","explorer"]],
  ["저녁 8시, 뭐 하고 있을까요?",["루프탑 바에서 야경 보기","urban"],["숙소에서 컵라면과 넷플릭스","healer"]],
  ["낯선 음식 앞에서 나는?",["무조건 도전","foodie"],["아는 맛이 좋아요","healer"]],
  ["여행 다녀와서 가장 자랑하고 싶은 건?",["남들 안 가본 곳에 다녀온 것","explorer"],["그 도시의 핫플을 다 가본 것","urban"]]
];

const W = "https://thumb.wikimedia.org/wikipedia/commons/thumb/";
const C = "https://commons.wikimedia.org/wiki/File:";
// photos: [사진 URL, 장소 이름, 작가, 라이선스, 원본 페이지]
const DESTS = [
  {c:"DAD",n:"다낭",k:"베트남",t:{healer:3,foodie:2},p:"both",w:"warm",cost:[50,100],d:["short","mid"],season:"2~5월 (건기)",stay:"3박 4일~4박 5일",bad:["fall"],
   fit:"리조트에서 푹 쉬다가 저녁엔 호이안 등불 야경까지 볼 수 있어요",
   spots:[["용다리","주말 밤 9시, 용이 진짜로 불과 물을 뿜어요"],["바나힐 골든브릿지","거대한 손이 받치고 있는 구름 위 다리"],["호이안 올드타운","밤마다 등불이 켜지는 옛 무역항 거리"]],

const condLabel=(k,v)=>(COND[k].find(x=>x[0]===v)||["",""])[1];

function compute(){
  const sc={explorer:0,foodie:0,healer:0,urban:0};
  const picked={explorer:[],foodie:[],healer:[],urban:[]};
  answers.forEach((a,i)=>{ const o=QS[i][a==="a"?1:2]; sc[o[1]]++; picked[o[1]].push(o[0]); });
  const order=TYPE_KEYS.slice().sort((x,y)=>sc[y]-sc[x]);
  const type=order[0];
  const [bmin,bmax]=BUDGET[cond.budget];
  const ranked=DESTS.map(d=>{
    let s=0; const why=[];
    TYPE_KEYS.forEach(t=>s+=(d.t[t]||0)*sc[t]);
    s+=(d.t[type]||0)*4;
    if((d.t[type]||0)>=2) why.push(`${TYPES[type].n} 유형과 찰떡: ${d.fit}`);
    else why.push(d.fit);
    if(cond.place!=="both" && d.p!==cond.place && d.p!=="both") s-=12; else if(cond.place!=="both") why.push(`원하는 ${condLabel("place",cond.place)} 여행에 맞아요`);
    if(cond.weather!=="any" && d.w!=="any" && d.w!==cond.weather) s-=8; else if(cond.weather!=="any") why.push(`원하는 날씨(${condLabel("weather",cond.weather)})와 맞아요`);
    if(d.cost[0]>bmax) s-=12;
    else if(d.cost[1]<bmin) s-=2;
    else { s+=6; why.push(`예산 ${condLabel("budget",cond.budget)} 안에서 다녀올 수 있어요`); }
    if(d.d.includes(cond.days)){ s+=6; why.push(`${condLabel("days",cond.days)} 일정에 알맞아요`); } else s-=5;
    if(d.bad.includes(cond.season)) s-=6;
    if(d.good&&d.good.includes(cond.season)){ s+=4; why.push(`${condLabel("season",cond.season)}이 제철이에요`); }
    return {d,s,why};
  }).sort((a,b)=>b.s-a.s).slice(0,3);
  return {sc,picked,order,type,ranked};
}

function encode(){ return "r="+answers.join("")+"-"+Object.keys(COND).map(k=>COND[k].findIndex(x=>x[0]===cond[k])).join(""); }
function decode(h){
  const m=/^#?r=([ab]{15})-(\d{5})$/.exec(h||""); if(!m) return false;
  const idx=m[2].split("").map(Number); const keys=Object.keys(COND);
  if(keys.some((k,i)=>!COND[k][idx[i]])) return false;
  answers=m[1].split(""); keys.forEach((k,i)=>cond[k]=COND[k][idx[i]][0]); return true;
}

// 인스타 스토리(1080x1920) 결과 이미지
async function makeImage(R){
  const T=TYPES[R.type], ranked=R.ranked.map(r=>r.d);
  const c=document.createElement("canvas"); c.width=1080; c.height=1920;
  const g=c.getContext("2d");
  const ink="#14353d", paper="#fbfdfc", accent="#e2543a", stamp="#f2b33d", muted="#5b7177", line="#c9d6d9";
  const disp='"Do Hyeon","Gothic A1",sans-serif', body='"Gothic A1",sans-serif', mono='"IBM Plex Mono",monospace';
  g.fillStyle=ink; g.fillRect(0,0,1080,1920);
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  rr(80,140,920,1640,40); g.fillStyle=paper; g.fill();
  g.fillStyle=muted; g.font=`600 30px ${mono}`; g.textAlign="left"; g.fillText("BOARDING PASS",140,230);
  g.textAlign="right"; g.fillText("ICN → "+ranked[0].c,940,230);
  g.strokeStyle=line; g.lineWidth=4; g.setLineDash([16,14]); g.beginPath(); g.moveTo(80,280); g.lineTo(1000,280); g.stroke(); g.setLineDash([]);
  try{
    const img=new Image(); img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(charSVG(R.type));
    await new Promise((ok,no)=>{img.onload=ok; img.onerror=no;});
    g.drawImage(img,400,310,280,280);
  }catch(e){}
  g.textAlign="center";
  g.fillStyle=muted; g.font=`600 34px ${body}`; g.fillText("나의 여행 유형은",540,640);
  g.fillStyle=ink; g.font=`100px ${disp}`; g.fillText(T.n,540,750);
  g.fillStyle=muted; g.font=`600 32px ${body}`; g.fillText(`15문항 중 ${R.sc[R.type]}개 · 찰떡 메이트 ${TYPES[T.best[0]].n}`,540,815);
  let top=900;
  g.fillStyle=muted; g.font=`600 30px ${mono}`; g.fillText("RECOMMENDED ROUTES",540,top); top+=50;
  ranked.forEach((d,i)=>{
    const yy=top+i*170;
    rr(140,yy,800,140,24); g.fillStyle="#dfecee"; g.fill();
    g.textAlign="left"; g.fillStyle=ink; g.font=`800 48px ${body}`; g.fillText(`${i+1}. ${d.n}`,180,yy+66);
    g.fillStyle=muted; g.font=`600 30px ${body}`; g.fillText(d.k,180,yy+112);
    g.textAlign="right"; rr(700,yy+44,210,56,10); g.fillStyle=stamp; g.fill();
    g.fillStyle="#2b1d00"; g.font=`600 32px ${mono}`; g.fillText(`ICN→${d.c}`,890,yy+84);
    g.textAlign="center";
  });
  g.fillStyle=accent; rr(220,1530,640,100,50); g.fill();
  g.fillStyle="#fff"; g.font=`800 38px ${body}`; g.fillText("너의 여행 취향도 알려줘!",540,1593);
  g.fillStyle=muted; g.font=`600 28px ${body}`; g.fillText(location.host+location.pathname,540,1700);
  g.fillStyle=paper; g.font=`600 30px ${mono}`; g.fillText("여행 취향 테스트",540,1850);
  return c.toDataURL("image/png");
}
